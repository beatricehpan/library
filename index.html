<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>My Library</h1>
        <button id="new-book">New Book</button>
    </header>
    <main id="library"></main>
    <dialog id="book-dialog">
        <form id="book-form">
            <label>Title <input type="text" id="title" required></label>
            <label>Author <input type="text" id="author" required></label>
            <label>Pages <input type="number" id="pages" min="1" required></label>
            <label><input type="checkbox" id="read"> Read it already</label>
            <button type="submit">Add Book</button>
            <button type="button" id="cancel">Cancel</button>
        </form>
    </dialog>
</body>

</html>
